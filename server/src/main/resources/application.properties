spring.application.name=social
# MySql Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/social_media
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# SQL Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.personal.social=DEBUG

# Enable WebSocket support
spring.websocket.enabled=true

# CORS settings for WebSocket
spring.websocket.cors.allowed-origins=*
spring.websocket.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.websocket.cors.allowed-headers=*
spring.websocket.cors.allow-credentials=true

# Logging for WebSocket debug
logging.level.personal.social.config.socket=DEBUG
logging.level.org.springframework.web.socket=DEBUG

file.upload-dir=uploads

